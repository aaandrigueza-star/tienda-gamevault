# Nombre de la aplicación para identificarla en logs y en la consola de Spring.
spring.application.name=operacion-ultima-milla

# Muestra el mensaje de error completo en respuestas HTTP para facilitar depuración.
server.error.include-message=always

# Habilita la consola web de H2 para consultar la base de datos desde el navegador.
# Ejemplo: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Base de datos H2 en archivo: conserva videojuegos y pedidos entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/gamevault
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
